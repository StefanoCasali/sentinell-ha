<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentinella</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<header class="top">
  <h1>
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
      <path d="M12 2.5 4 5.5v6c0 5 3.4 8.4 8 10 4.600-1.600 8-5 8-10v-6z"/><circle cx="12" cy="11.500" r="3.200"/><circle cx="12" cy="11.500" r=".6" fill="currentColor"/>
    </svg>
    Sentinella
  </h1>
  <button id="scan" class="btn primary"></button>
</header>

<!-- Testi, radar e viste vengono composti da app.js nella lingua corrente. -->
<nav id="sections" class="sections" aria-label="Networks"></nav>
<section id="hero" class="hero" aria-live="polite"></section>

<nav class="tabs" role="tablist"></nav>
<main id="view"></main>

<div id="toasts" role="status" aria-live="polite"></div>

<dialog id="confirm">
  <h2 id="confirm-title"></h2>
  <p id="confirm-text"></p>
  <div class="dialog-actions">
    <button id="confirm-no" class="btn"></button>
    <button id="confirm-yes" class="btn danger"></button>
  </div>
</dialog>

<script src="static/app.js"></script>
</body>
</html>
