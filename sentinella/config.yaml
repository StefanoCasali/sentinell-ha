name: Sentinella
version: "0.3.0"
slug: sentinella
description: Controllo di sicurezza della rete di casa - dispositivi, porte aperte, router
url: https://github.com/StefanoCasali/sentinell-ha
arch:
  - aarch64
  - amd64
init: false
# Rete dell'host: serve per vedere i dispositivi della LAN (ARP) e il router (UPnP).
host_network: true
ingress: true
ingress_port: 8099
panel_icon: mdi:shield-search
panel_title: Sentinella
homeassistant_api: true
# Se c'è un broker MQTT (add-on Mosquitto) i sensori passano da lì; altrimenti dall'API di Home Assistant.
services:
  - mqtt:want
options:
  scan_interval_hours: 6
  networks: []
  extra_ports: []
  active_probes: true
  notify: true
  device_entities: true
  ha_links: true
  deep_scan: false
schema:
  scan_interval_hours: int(1,168)
  networks:
    - str
  extra_ports:
    - port
  active_probes: bool
  notify: bool
  device_entities: bool
  ha_links: bool
  deep_scan: bool
  # Solo per un broker diverso dall'add-on Mosquitto: con Mosquitto le credenziali arrivano dal Supervisor.
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
