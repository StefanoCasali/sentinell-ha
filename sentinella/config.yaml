name: Sentinella
version: "0.5.0"
slug: sentinella
description: Home network security monitor - devices, risky open ports, router exposure, incidents
url: https://github.com/StefanoCasali/sentinell-ha
arch:
  - aarch64
  - amd64
init: false
# Host network: needed to see LAN devices (ARP) and the router (UPnP).
host_network: true
ingress: true
ingress_port: 8099
panel_icon: mdi:shield-search
panel_title: Sentinella
homeassistant_api: true
# With an MQTT broker (Mosquitto add-on) sensors go through it; otherwise through the Home Assistant API.
services:
  - mqtt:want
options:
  scan_interval_hours: 6
  networks: []
  extra_ports: []
  active_probes: true
  notify: true
  device_entities: true
  ha_links: true
  deep_scan: false
  language: auto
schema:
  scan_interval_hours: int(1,168)
  networks:
    - str
  extra_ports:
    - port
  active_probes: bool
  notify: bool
  device_entities: bool
  ha_links: bool
  deep_scan: bool
  language: list(auto|en|it)
  # Only for a broker other than the Mosquitto add-on: with Mosquitto the Supervisor provides the credentials.
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
