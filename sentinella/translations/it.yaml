configuration:
  scan_interval_hours:
    name: Intervallo tra le scansioni (ore)
    description: Ore tra una scansione automatica e la successiva.
  networks:
    name: Reti da controllare
    description: Reti in forma CIDR, per esempio 192.168.1.0/24. Lascia vuoto per controllare la rete a cui è collegato Home Assistant.
  extra_ports:
    name: Porte aggiuntive
    description: Altre porte TCP da controllare su ogni dispositivo.
  active_probes:
    name: Verifica gli accessi senza password
    description: Controlla con una sola connessione in sola lettura se i servizi accettano accessi senza password (FTP anonimo, MQTT, Redis, VNC, SMBv1).
  notify:
    name: Notifiche
    description: Crea una notifica in Home Assistant a ogni incidente di sicurezza.
  device_entities:
    name: Un sensore per dispositivo (non più usato)
    description: Deprecato. Dalla 0.6.0 vengono pubblicati solo sensori aggregati; quelli per dispositivo già creati vengono rimossi in automatico.
  monitor_zigbee:
    name: Monitora Zigbee
    description: Sezione Zigbee (ZHA, Zigbee2MQTT, deCONZ) - dispositivi che non comunicano, batterie, segnale, aggiornamenti.
  monitor_zwave:
    name: Monitora Z-Wave
    description: Sezione Z-Wave (Z-Wave JS).
  monitor_matter:
    name: Monitora Matter
    description: Sezione Matter.
  monitor_bluetooth:
    name: Monitora Bluetooth
    description: Sezione Bluetooth (BTHome, Xiaomi BLE, SwitchBot e altre integrazioni Bluetooth).
  monitor_mqtt:
    name: Monitora MQTT
    description: Sezione MQTT - dispositivi che arrivano a Home Assistant tramite MQTT.
  monitor_access:
    name: Monitora gli accessi a Home Assistant
    description: Sezione Accessi - tentativi di accesso falliti e indirizzi bloccati trovati nel log di Home Assistant.
  zigbee2mqtt_in_zigbee:
    name: Dispositivi Zigbee2MQTT sotto Zigbee
    description: Attiva - i dispositivi Zigbee2MQTT compaiono solo nella sezione Zigbee e MQTT mostra tutto il resto. Spenta - vengono contati sotto MQTT. Un dispositivo non viene mai segnalato in entrambe.
  health_interval_minutes:
    name: Intervallo dei controlli sulla domotica (minuti)
    description: Minuti tra un controllo della domotica e il successivo. Sono controlli leggeri, indipendenti dalla scansione di rete.
  battery_threshold:
    name: Soglia di batteria scarica (%)
    description: Livello di batteria al di sotto del quale un dispositivo viene segnalato.
  silent_hours:
    name: Soglia di silenzio (ore)
    description: Ore senza comunicazioni dopo le quali un dispositivo a batteria è considerato non più in comunicazione.
  ha_links:
    name: Collega i dispositivi alla domotica
    description: Cerca quali dispositivi ed entità di Home Assistant corrispondono già a ogni dispositivo di rete.
  deep_scan:
    name: Scansione approfondita
    description: Rileva versioni dei servizi e sistema operativo con nmap. Più lenta e più visibile ai dispositivi.
  language:
    name: Lingua
    description: Lingua di pannello, falle, incidenti e nomi delle entità. "auto" segue la lingua di Home Assistant (italiano o inglese).
  mqtt_host:
    name: Host del broker MQTT
    description: Solo per un broker diverso dall'add-on Mosquitto. Lascia vuoto per usare quello fornito dal Supervisor.
  mqtt_port:
    name: Porta del broker MQTT
    description: Porta del broker indicato a mano (predefinita 1883).
  mqtt_username:
    name: Utente MQTT
    description: Utente del broker indicato a mano.
  mqtt_password:
    name: Password MQTT
    description: Password del broker indicato a mano.
